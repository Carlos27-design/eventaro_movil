<ion-header>
  <ion-toolbar>
    <ion-title>Lector QR</ion-title>
    <ion-buttons slot="end">
      <ion-button color="danger" (click)="logout()">
        <ion-icon name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ngx-scanner-qrcode
    #scanner
    (scanSuccess)="scanSuccess($event)"
  ></ngx-scanner-qrcode>
</ion-content>
